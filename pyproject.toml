[project]
name = "semblon"
dynamic = ["version"]
description = "Local face intelligence — folder-first observation engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "insightface",
  "onnxruntime",
  "opencv-python-headless",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
gui = ["PySide6>=6.6"]  # optional Qt client (`semblon shell`) + S8 spike; not the product Home

[project.scripts]
semblon = "semblon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "semblon.__version__"}

[tool.setuptools.packages.find]
include = ["semblon*"]

[tool.setuptools.package-data]
semblon = ["review_chrome/*.css", "review_chrome/*.html", "review_chrome/*.js"]
