[project]
name = "semblon"
dynamic = ["version"]
description = "Local face intelligence — folder-first observation engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "insightface",
  "onnxruntime",
  "opencv-python-headless",
  "numpy",
  "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]
gui = ["PySide6>=6.6"]  # forward shell (`semblon shell`)

[project.scripts]
semblon = "semblon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"

[tool.setuptools.dynamic]
version = {attr = "semblon.__version__"}

[tool.setuptools.packages.find]
include = ["semblon*"]
