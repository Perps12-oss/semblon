[project]
name = "semblon"
version = "1.0.0"
description = "Local face intelligence — folder-first observation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "insightface",
  "onnxruntime",
  "opencv-python-headless",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
cluster = ["scikit-learn"]

[project.scripts]
semblon = "semblon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["semblon*"]
