# Portable CI: no InsightFace weight download, no owner dump.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 xvfb
      - name: Install declared test deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[dev]"
          python -m pip uninstall -y opencv-python opencv-contrib-python
          python -m pip install --force-reinstall --no-deps opencv-python-headless==5.0.0.93
          python tools/assert_one_opencv.py
      - name: Pytest (no live InsightFace)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Pytest (no live InsightFace, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: pip-audit resolved install
        run: |
          python -m pip install pip-audit
          python -m pip freeze --exclude-editable > resolved-requirements.txt
          python -m pip_audit -r resolved-requirements.txt
