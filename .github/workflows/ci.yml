# One Windows check. No InsightFace weight download, no owner dump.
# Ubuntu, Python 3.11/3.13/3.14, the lock compile, and pip-audit are not run
# here. The supported range is unchanged. See
# docs/decisions/2026-10-16-python-support-policy.md.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install declared test deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[dev]"
          python -m pip uninstall -y opencv-python opencv-contrib-python
          python -m pip install --force-reinstall --no-deps opencv-python-headless==5.0.0.93
          python tools/assert_one_opencv.py
      - name: Pytest (no live InsightFace)
        run: python -m pytest -q
