# Portable CI: no InsightFace weight download, no owner dump.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install portable test deps
        run: |
          python -m pip install -U pip
          python -m pip install numpy opencv-python-headless pillow pytest "PySide6>=6.6"
          python -m pip install -e . --no-deps
      - name: Pytest (no live InsightFace)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Pytest (no live InsightFace, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: pip-audit declared runtime
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip-audit -r requirements.txt
